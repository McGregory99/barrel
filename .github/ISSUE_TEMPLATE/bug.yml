name: Bug in Barrel
description: Something in the app or the barrel command does not work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: 1. Open Barrel  2. Click …
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
    validations:
      required: true
